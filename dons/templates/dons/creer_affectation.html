{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h1>{% trans "Créer une affectation" %}</h1>
{% if messages %}
  {% for message in messages %}<p>{{ message }}</p>{% endfor %}
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% trans "Créer l'affectation" %}</button>
</form>
{% endblock %}
