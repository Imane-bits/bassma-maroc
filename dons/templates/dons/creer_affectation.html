{% extends "responsable_base.html" %}
{% load i18n %}
{% block dashboard_content %}
<div style="max-width:520px">
  <div class="section-title" style="text-align:start">
    <h2 style="color:var(--color-primary)">{% trans "Créer une affectation" %}</h2>
  </div>
  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p style="color:var(--color-danger);font-size:13px">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">{% trans "Créer l'affectation" %}</button>
    </form>
  </div>
</div>
{% endblock %}
