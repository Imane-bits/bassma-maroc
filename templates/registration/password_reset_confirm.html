{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h1>{% trans "Nouveau mot de passe" %}</h1>
{% if validlink %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% trans "Changer le mot de passe" %}</button>
</form>
{% else %}
<p>{% trans "Ce lien de réinitialisation n'est plus valide." %}</p>
{% endif %}
{% endblock %}
