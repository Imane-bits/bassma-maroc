{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h1>{% trans "Connexion" %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% trans "Se connecter" %}</button>
</form>
<p><a href="{% url 'password_reset' %}">{% trans "Mot de passe oublié ?" %}</a></p>
<p><a href="{% url 'inscription' %}">{% trans "Créer un compte" %}</a></p>
{% endblock %}
