{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h1>{% blocktrans with first_name=user.first_name last_name=user.last_name %}Bienvenue, {{ first_name }} {{ last_name }}{% endblocktrans %}</h1>
<p>{% trans "Rôle :" %} {{ user.role }}</p>
<form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit">{% trans "Se déconnecter" %}</button>
</form>
{% endblock %}
