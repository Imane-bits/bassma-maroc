{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container" style="max-width:520px">
  <section class="hero" style="padding-bottom:24px">
    <div class="hero-badge">🔎</div>
    <h1 style="font-size:28px">{% trans "تتبّع ملفي" %}</h1>
    <p>{% trans "أدخل رقم الملف لعرض حالته وتحديث معطياتك." %}</p>
  </section>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="numero_dossier">{% trans "رقم الملف" %}</label>
        <input type="text" id="numero_dossier" name="numero_dossier" required placeholder="DOS-2026-000123">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">{% trans "عرض الملف" %}</button>
    </form>
  </div>

  {% if demande %}
    <div class="form-card">
      {% include "aide/_demande_detail_content.html" %}
    </div>
  {% endif %}
</div>
{% endblock %}
